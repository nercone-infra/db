stream {
    include /etc/nginx/snippets/ruconet-stream.conf;

    map $ssl_client_s_dn $ruconet_source {
        "CN=mail.ruconet.internal"  127.0.0.5;
        "CN=gitea.ruconet.internal" 127.0.0.7;
        default                     "";
    }

    # PostgreSQL
    server {
        listen db.ruconet.internal:5432 ssl;

        include /etc/nginx/snippets/ruconet.conf;

        proxy_pass 127.0.0.1:5432;
        proxy_bind $ruconet_source;
        proxy_timeout 12h;
    }
}
